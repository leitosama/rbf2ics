name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Единый источник правды по функции и бакету. Этот же файл читает terraform
      # через jsondecode, поэтому значения здесь и в инфраструктуре совпадают
      # по построению — синхронизировать руками нечего.
      - name: Read deploy config
        id: cfg
        run: |
          set -euo pipefail
          jq -r '
            "name=\(.name)",
            "runtime=\(.runtime)",
            "entrypoint=\(.entrypoint)",
            "memory=\(.memory)",
            "timeout=\(.timeout)",
            "bucket=\(.bucket)"
          ' .deploy/function.json >> "$GITHUB_OUTPUT"

      - name: Get Yandex Cloud IAM token
        id: yc-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}

      - name: Deploy function
        uses: yc-actions/yc-sls-function@v5
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          function-name: ${{ steps.cfg.outputs.name }}
          runtime: ${{ steps.cfg.outputs.runtime }}
          entrypoint: ${{ steps.cfg.outputs.entrypoint }}
          # Экшен требует формат ^\d+Mb$, поэтому суффикс добавляется здесь,
          # а в function.json память лежит числом — его же читает terraform.
          memory: ${{ steps.cfg.outputs.memory }}Mb
          execution-timeout: ${{ steps.cfg.outputs.timeout }}
          source-root: rbf2ics
          # Всё содержимое пакета, а не только *.py: рядом лежит requirements.txt,
          # без него рантайм не поставит requests и функция упадёт на импорте.
          include: |
            **/*

      - name: Upload frontend
        uses: yc-actions/yc-obj-storage-upload@v4
        with:
          yc-sa-id: ${{ vars.YC_SA_ID }}
          bucket: ${{ steps.cfg.outputs.bucket }}
          root: ./frontend
          include: '**/*'
          skip-unchanged: true
          cache-control: |
            *.html: no-cache
            *: public, max-age=3600
